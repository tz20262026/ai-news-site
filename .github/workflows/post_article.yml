name: 毎日1記事自動投稿

on:
  schedule:
    - cron: '0 0 * * *'    # 日本時間 9:00 (UTC 0:00) に起動、その後ランダム遅延
  workflow_dispatch:        # 手動実行ボタン

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: コードを取得
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: GCP認証
        uses: google-github-actions/auth@v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pythonセットアップ
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: 依存関係インストール
        run: pip install google-genai google-cloud-storage

      - name: ランダム遅延（9:00〜13:00 JST のどこかで投稿）
        run: |
          DELAY=$((RANDOM % 14400))
          echo "遅延: ${DELAY}秒 ($(echo "$DELAY / 60" | bc)分後に投稿)"
          sleep $DELAY

      - name: 記事生成
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: us-central1
        run: python scripts/post_one_article.py

      - name: 英語記事を日本語に翻訳
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: us-central1
        run: python scripts/translate_english_articles.py

      - name: GitHubにプッシュ（Vercelが自動デプロイ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/extra_articles.json scripts/data/vercel_posted_ids.log
          if git diff --cached --quiet; then
            echo "変更なし。スキップします。"
            exit 0
          fi
          git commit -m "記事追加: $(date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && echo "✅ プッシュ成功" && exit 0
            echo "⚠️ push失敗 (試行 $i/5)、$((i * 15))秒後に再試行..."
            sleep $((i * 15))
          done
          echo "❌ 5回試行しても失敗"
          exit 1
