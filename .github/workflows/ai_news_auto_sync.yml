name: AI市場インテリジェンス 自動同期

on:
  schedule:
    # 毎日午前9時30分（日本時間）= UTC 0:30（post_article.yml と時刻をずらす）
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '強制更新（差分がなくてもコミット）'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: GCP認証（post_article.yml と同じ設定を流用）
        uses: google-github-actions/auth@v2.1.8
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Python セットアップ
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: 依存関係インストール（post_article.yml と同じ）
        run: pip install google-genai google-cloud-storage json-repair

      - name: AI市場データ同期スクリプトを実行
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: us-central1
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python scripts/sync_ai_market.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "267490088+tz20262026@users.noreply.github.com"
          git add src/data/ai_market_intelligence.json
          if git diff --cached --quiet && [ "${{ inputs.force_update }}" != "true" ]; then
            echo "変更なし。スキップします。"
          else
            git commit -m "feat: AIによる市場インテリジェンス自動更新 $(date '+%Y-%m-%d %H:%M JST')"
            # スクリプトが残した未ステージ変更・未追跡ファイルを掃除しないと rebase が失敗する
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && echo "✅ プッシュ完了。Vercel が自動デプロイを開始します。" && exit 0
              sleep $((i * 15))
            done
            echo "❌ 5回リトライしても push できませんでした"
            exit 1
          fi
